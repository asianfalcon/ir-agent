services:
  wechat-api:
    image: tmwgsicp/wechat-download-api:latest
    container_name: ira-wechat-download-api
    restart: unless-stopped
    ports:
      # Keep the credential-bearing service local by default.
      - "127.0.0.1:${WECHAT_API_PORT:-5000}:5000"
    volumes:
      - ./data:/app/data
      - ./wechat.env:/app/.env:ro
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

